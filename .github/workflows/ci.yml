# Continuous integration: checks every pull request and every push to main. It only TESTS. It never deploys, never publishes a release,
# never touches a laptop, uses no secrets, and runs nothing as root (tests that need real administrator rights are not part of CI).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read            # the only permission any job here has

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    name: Static analysis (ruff, bandit, shellcheck)
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.10"
      - run: python -m pip install -r requirements-dev.txt
      - name: ruff
        run: ruff check .
      - name: bandit (medium and high severity must be clean)
        run: bandit -q -ll -c .bandit -r LinuxGuardianSuite LinuxGuardianSuiteUI/linuxguardian_ui
      - name: shell syntax
        run: |
          set -e
          for f in LinuxGuardianSuite/*.sh LinuxGuardianSuiteUI/*.sh tests/*.sh; do bash -n "$f"; done
      - name: shellcheck (warnings and errors)
        run: shellcheck -S warning LinuxGuardianSuite/*.sh LinuxGuardianSuiteUI/*.sh

  test:
    name: Tests (pytest + shell suites, headless GTK)
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - name: System packages (the same GTK4 / libadwaita 1.1 the target Ubuntu 22.04 has)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-venv python3-gi gir1.2-gtk-4.0 gir1.2-adw-1 xvfb git shellcheck
      - name: Python environment (system site packages so PyGObject is visible)
        run: |
          python3 -m venv --system-site-packages .venv
          .venv/bin/python -m pip install -r requirements-dev.txt
      - name: pytest with coverage (unit, integration, end-to-end, regression, security-input and failure tests)
        working-directory: LinuxGuardianSuiteUI
        run: |
          # -v and faulthandler show WHICH test is slow or stuck; the hard `timeout` stops a hang before the job limit.
          set -o pipefail
          timeout 1200 xvfb-run -a ../.venv/bin/python -X faulthandler -m pytest tests -v -p no:cacheprovider \
            -o faulthandler_timeout=120 --durations=15 \
            --cov=../LinuxGuardianSuite --cov=linuxguardian_ui --cov-report=term --cov-report=xml:../coverage.xml 2>&1 | tee ../pytest.log
      - name: Where did pytest stop? (annotation, so the answer is visible without downloading logs)
        if: failure() || cancelled()
        run: |
          tail -n 60 pytest.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}' | sed 's/^/::error title=pytest log (last 60 lines)::/'; echo
      - name: shell test suites
        run: |
          set -e
          for t in tests/test_*.sh; do echo "== $t"; bash "$t"; done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: always()
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: ignore

  dependencies:
    name: Dependency vulnerabilities (pip-audit)
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.10"
      - run: python -m pip install pip-audit==2.10.1
      - name: The app itself has no third-party Python dependencies; audit the tooling it is tested with
        run: pip-audit -r requirements-dev.txt
